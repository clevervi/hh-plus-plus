name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build-all

      # dist/ is what users install from, so a source change that was never
      # rebuilt would ship stale code. .gitattributes pins every checkout to LF,
      # which is what makes this comparison meaningful across platforms.
      - name: Check dist is up to date with src
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is out of date - run 'npm run build-all' and commit the result"
            exit 1
          fi

      - run: npm test
