name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build-all

      # dist/ is what users install from, so a source change that was never
      # rebuilt would ship stale code. Only the published artefacts are checked:
      # the dev bundle is built with webpack's eval devtool, which embeds module
      # source verbatim, so its bytes follow the checkout's line endings and are
      # not comparable across platforms.
      - name: Check published userscript is up to date with src
        run: |
          if ! git diff --exit-code --ignore-cr-at-eol -- dist/hh-plus-plus.user.js dist/hh-plus-plus.meta.js; then
            echo "::error::The published userscript is out of date - run 'npm run build-all' and commit dist/"
            exit 1
          fi

      - run: npm test
